<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="blueBody" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#679BFF"/>
      <stop offset="0.28" stop-color="#3478F4"/>
      <stop offset="0.72" stop-color="#1852C8"/>
      <stop offset="1" stop-color="#103A9C"/>
    </linearGradient>
    <linearGradient id="blueFace" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#397EFF"/>
      <stop offset="0.52" stop-color="#2365E8"/>
      <stop offset="1" stop-color="#1749B5"/>
    </linearGradient>
    <linearGradient id="gold" x1="0.12" y1="0" x2="0.82" y2="1">
      <stop offset="0" stop-color="#FFF4B9"/>
      <stop offset="0.24" stop-color="#FFE477"/>
      <stop offset="0.62" stop-color="#FFC928"/>
      <stop offset="1" stop-color="#E99A00"/>
    </linearGradient>
    <linearGradient id="goldSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9A300"/>
      <stop offset="1" stop-color="#A96700"/>
    </linearGradient>
    <linearGradient id="symbolGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF5C8"/>
      <stop offset="0.4" stop-color="#FFD84D"/>
      <stop offset="1" stop-color="#E99A00"/>
    </linearGradient>
    <radialGradient id="shine" cx="50%" cy="0%" r="85%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".72"/>
      <stop offset=".45" stop-color="#FFFFFF" stop-opacity=".14"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Soft rounded blue body with a subtle lower extrusion. -->
  <rect x="12" y="25" width="476" height="476" rx="112" fill="#071B54"/>
  <rect x="12" y="12" width="476" height="476" rx="112" fill="url(#blueBody)"/>
  <rect x="22" y="20" width="456" height="456" rx="104" fill="url(#blueFace)"/>
  <ellipse cx="250" cy="58" rx="165" ry="52" fill="url(#shine)" opacity=".75"/>
  <ellipse cx="74" cy="248" rx="22" ry="100" fill="url(#shine)" opacity=".28"/>

  <!-- Raised scanning brackets; layered fills create rounded 3D depth without outlines. -->
  <g fill="#B97800" transform="translate(0 8)">
    <path d="M94 170 V116 Q94 88 122 88 H170 Q183 88 183 102 Q183 116 170 116 H128 V170 Q128 188 111 188 Q94 188 94 170Z"/>
    <path d="M330 88 H378 Q406 88 406 116 V170 Q406 188 389 188 Q372 188 372 170 V116 H330 Q317 116 317 102 Q317 88 330 88Z"/>
    <path d="M94 330 Q94 312 111 312 Q128 312 128 330 V384 H170 Q183 384 183 398 Q183 412 170 412 H122 Q94 412 94 384Z"/>
    <path d="M372 330 Q372 312 389 312 Q406 312 406 330 V384 Q406 412 378 412 H330 Q317 412 317 398 Q317 384 330 384 H372Z"/>
  </g>
  <g fill="url(#gold)">
    <path d="M94 170 V116 Q94 88 122 88 H170 Q183 88 183 102 Q183 116 170 116 H128 V170 Q128 188 111 188 Q94 188 94 170Z"/>
    <path d="M330 88 H378 Q406 88 406 116 V170 Q406 188 389 188 Q372 188 372 170 V116 H330 Q317 116 317 102 Q317 88 330 88Z"/>
    <path d="M94 330 Q94 312 111 312 Q128 312 128 330 V384 H170 Q183 384 183 398 Q183 412 170 412 H122 Q94 412 94 384Z"/>
    <path d="M372 330 Q372 312 389 312 Q406 312 406 330 V384 Q406 412 378 412 H330 Q317 412 317 398 Q317 384 330 384 H372Z"/>
  </g>

  <!-- Coin rim and face: smooth raised gold, no keyline strokes. -->
  <circle cx="250" cy="260" r="118" fill="url(#goldSide)"/>
  <circle cx="250" cy="250" r="116" fill="#F4B51C"/>
  <circle cx="250" cy="244" r="108" fill="url(#gold)"/>
  <ellipse cx="220" cy="178" rx="58" ry="20" fill="#FFFFFF" opacity=".2"/>
  <circle cx="250" cy="244" r="91" fill="none" stroke="#FFE99A" stroke-opacity=".18" stroke-width="3"/>

  <!-- Gold peso glyph with its own raised edge, never blue. -->
  <text x="250" y="326" text-anchor="middle" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif" font-size="205" font-weight="900" fill="#B97800">₱</text>
  <text x="250" y="318" text-anchor="middle" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif" font-size="205" font-weight="900" fill="url(#symbolGold)">₱</text>
  <path d="M204 184 Q250 166 296 184" fill="none" stroke="#FFFFFF" stroke-opacity=".22" stroke-width="7" stroke-linecap="round"/>
</svg>