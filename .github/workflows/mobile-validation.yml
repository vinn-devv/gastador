name: Mobile validation

on:
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-validation.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-validation.yml"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check Expo dependency compatibility
        run: npx expo install --check
      - name: Validate Expo configuration
        run: npx expo config --type public
      - name: Type-check mobile app
        run: npx tsc --noEmit
      - name: Lint mobile app
        run: npx expo lint
      - name: Bundle Android JavaScript and assets
        run: npx expo export --platform android
      - name: Generate Android native project
        run: npx expo prebuild --platform android --no-install
